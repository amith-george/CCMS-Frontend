<div class="sidebar-header">
  <mat-icon>gavel</mat-icon>
  <h2>CCMS Portal</h2>
</div>

<mat-nav-list>
  <a mat-list-item routerLink="/court/dashboard" routerLinkActive="active-link">
    <mat-icon matListItemIcon>dashboard</mat-icon>
    <div matListItemTitle>Dashboard</div>
  </a>

  <a mat-list-item routerLink="/court/new-case" routerLinkActive="active-link">
    <mat-icon matListItemIcon>add_circle</mat-icon>
    <div matListItemTitle>New Case</div>
  </a>
  
  <div class="spacer" style="flex: 1 1 auto;"></div>

  <a mat-list-item (click)="logout()" class="logout-btn">
    <mat-icon matListItemIcon class="logout-icon">logout</mat-icon>
    <div matListItemTitle>Logout</div>
  </a>
</mat-nav-list>
